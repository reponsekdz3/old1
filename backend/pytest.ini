[pytest]
# Pytest configuration for BiteSe comprehensive testing

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add current directory to path
pythonpath = .

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --color=yes
    --code-highlight=yes
    --capture=fd

# Coverage options
# Run with: pytest --cov=app --cov-report=html
testpaths = backend/tests

# Markers for organizing tests
markers =
    security: security-related tests
    e2ee: end-to-end encryption tests
    encryption: encryption functionality tests
    webrtc: WebRTC and real-time communication tests
    monetization: payment and monetization tests
    scalability: scalability and performance tests
    integration: integration tests
    unit: unit tests
    slow: slow running tests
    requires_db: tests requiring database
    requires_stripe: tests requiring Stripe API
    cryptography: cryptographic tests
    compliance: compliance and regulatory tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s::%(filename)s::%(funcName)s::%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeouts
timeout = 300
timeout_method = thread

# Flaky test retry
# Install: pip install pytest-rerunfailures
reruns = 1
reruns_delay = 1

# Test collection ignore patterns
norecursedirs = .git .venv venv __pycache__ *.egg-info build dist

# Database isolation
# Ensures each test gets clean database state
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Fixtures
fixture_return_override = true

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
