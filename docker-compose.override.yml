version: '3.9'

# Docker Compose override for local development
# This file extends docker-compose.yml with dev-specific settings

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      - /app/__pycache__
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: python run.py
    
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for hot reload
      - ./web/src:/app/src
      - ./web/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    command: npm start
    
  mysql:
    ports:
      # Expose MySQL for external tools (e.g., MySQL Workbench)
      - "3306:3306"
    
  redis:
    ports:
      # Expose Redis for external tools (e.g., RedisInsight)
      - "6379:6379"
