version: '3.9'

services:
  # MySQL Primary Database
  mysql-primary:
    image: mysql:8.0
    container_name: vipchat-mysql-primary
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_REPLICATION_MODE: master
      MYSQL_REPLICATION_USER: repl_user
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql-primary.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=1000 --innodb-buffer-pool-size=2G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vipchat-production

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: vipchat-redis-master
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_master_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vipchat-production

  # Redis Replica
  redis-replica:
    image: redis:7-alpine
    container_name: vipchat-redis-replica
    restart: always
    command: >
      redis-server
      --replicaof redis-master 6379
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}
    depends_on:
      - redis-master
    networks:
      - vipchat-production

  # Backend - Multiple Instances
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vipchat-backend-1
    restart: always
    environment:
      INSTANCE_ID: backend-1
      MYSQL_HOST: mysql-primary
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      AFRICAN_TALKING_API_KEY: ${AFRICAN_TALKING_API_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      FLASK_ENV: production
    volumes:
      - uploads_shared:/app/uploads
      - logs_backend_1:/app/logs
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - vipchat-production

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vipchat-backend-2
    restart: always
    environment:
      INSTANCE_ID: backend-2
      MYSQL_HOST: mysql-primary
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      AFRICAN_TALKING_API_KEY: ${AFRICAN_TALKING_API_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      FLASK_ENV: production
    volumes:
      - uploads_shared:/app/uploads
      - logs_backend_2:/app/logs
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - vipchat-production

  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vipchat-frontend
    restart: always
    depends_on:
      - backend-1
      - backend-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - vipchat-production

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: vipchat-nginx-lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend-1
      - backend-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vipchat-production

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vipchat-celery-worker
    restart: always
    command: celery -A app.celery worker --loglevel=info --concurrency=4
    environment:
      MYSQL_HOST: mysql-primary
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - uploads_shared:/app/uploads
      - logs_celery:/app/logs
    depends_on:
      - redis-master
      - mysql-primary
    networks:
      - vipchat-production

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vipchat-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - vipchat-production

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: vipchat-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - vipchat-production

volumes:
  mysql_primary_data:
    driver: local
  redis_master_data:
    driver: local
  uploads_shared:
    driver: local
  logs_backend_1:
    driver: local
  logs_backend_2:
    driver: local
  logs_celery:
    driver: local
  nginx_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  vipchat-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
