version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: vipchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-VipChat_Root_2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VipChat_DB_Password_2024!}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-VipChat_Root_2024!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - vipchat-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vipchat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-VipChat_Redis_2024!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vipchat-network

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vipchat-backend
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-development}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vipchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VipChat_DB_Password_2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vipchat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-VipChat_Redis_2024!}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-123456789abcdef}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-987654321fedcba}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      AFRICAN_TALKING_USERNAME: ${AFRICAN_TALKING_USERNAME:-sandbox}
      AFRICAN_TALKING_API_KEY: ${AFRICAN_TALKING_API_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-admin@vipchat.local}
      APP_URL: ${APP_URL:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5000,http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./releases:/app/uploads/releases
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vipchat-network

  # React Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vipchat-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vipchat-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vipchat-network:
    driver: bridge
